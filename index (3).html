<style>
:root{--p:#5b4bdb;--p2:#8a7cff;--y:#ffc93c;--g:#1fb5a3;--pk:#ff5d8f;--o:#ff8c42;--r:#ef4444;--bg:#f4f1ff;--tx:#2a2250;--mu:#7b7499;--line:#e6e0fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Tajawal',sans-serif;background:radial-gradient(circle at 0 0,#ffe7f0 0,transparent 35%),radial-gradient(circle at 100% 30%,#e3f4ff 0,transparent 35%),var(--bg);background-attachment:fixed;color:var(--tx);min-height:100vh;display:flex;flex-direction:column}
.en{font-family:'Baloo 2','Tajawal',sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 4px 18px #5b4bdb33}
.topin{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{font-weight:800;font-size:20px;color:#fff;display:flex;align-items:center;gap:6px;margin-inline-end:auto}
.pts{background:#fff;color:var(--p);border-radius:999px;padding:6px 14px;font-weight:800;font-size:18px}
.pts.bump{animation:bump .5s}
@keyframes bump{50%{transform:scale(1.25)}}
.ic{font-size:20px;background:#ffffff26;border-radius:12px;width:40px;height:40px}
#app{flex:1;width:100%;max-width:900px;margin:0 auto;padding:16px 16px 32px}
.foot{text-align:center;padding:18px 16px 24px;color:var(--mu);font-size:14px;border-top:1px solid var(--line);background:#ffffffb0;line-height:1.7}
.foot b{color:var(--p);font-size:16px}
.hero{text-align:center;padding:20px 0 4px}
.logo{font-size:64px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.hero h1{font-family:'Baloo 2';font-size:42px;margin:0;color:var(--p);line-height:1.1}
.sub{margin:4px 0 0;color:var(--mu);font-weight:700;font-size:18px}
.ttl{text-align:center;font-size:20px;margin:22px 0 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile{background:var(--c,var(--p));color:#fff;border-radius:22px;padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 #0002;transition:transform .15s}
.tile:active{transform:translateY(3px);box-shadow:0 3px 0 #0002}
.tile b{font-size:24px}
.tile.name{background:#fff;color:var(--tx);border:3px solid var(--line);font-size:30px;box-shadow:0 5px 0 var(--line)}
.tile.name span{font-size:17px;font-weight:700;line-height:1.4}
.tile.sec{padding:28px 10px}.tile.sec b{font-size:30px}.sic{font-size:64px;animation:hop 1.8s ease-in-out infinite;display:inline-block}
.center{text-align:center;margin-top:26px}
.link{color:var(--mu);font-weight:700;text-decoration:underline}
.back{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 14px;font-weight:700;color:var(--mu);margin-bottom:12px}
.pinbox{text-align:center;max-width:340px;margin:0 auto}
.avatar{font-size:60px}
.pinbox h2{margin:4px 0}
.dots{display:flex;justify-content:center;gap:14px;margin:16px 0}
.dots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--p)}
.dots i.on{background:var(--p)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{background:#fff;border-radius:18px;font-size:28px;font-weight:800;padding:14px 0;box-shadow:0 4px 0 var(--line);font-family:'Baloo 2'}
.hello{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 20px #5b4bdb14;flex-wrap:wrap}
.hello h1{margin:0;font-size:26px}
.hello p{margin:4px 0 0;color:var(--mu)}
.badge{text-align:center;display:flex;flex-direction:column;align-items:center;background:#fff8e1;border-radius:18px;padding:8px 16px}
.badge span{font-size:34px}
.badge small{color:var(--mu)}
.prog{margin:14px 4px}
.bar,.mini{height:14px;background:#e9e4ff;border-radius:99px;overflow:hidden}
.bar i,.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--o));border-radius:99px}
.mini{height:8px;margin-top:6px}
.mini i{background:var(--g)}
.prog small{color:var(--mu);display:block;margin-top:6px;font-weight:700}
.worlds{display:grid;gap:16px;margin-top:8px}
@media(min-width:720px){.worlds{grid-template-columns:1.4fr 1fr}}
.world{border-radius:26px;padding:18px;color:#fff}
.en-w{background:linear-gradient(135deg,#3a86ff,#5b4bdb)}
.ar-w{background:linear-gradient(135deg,#1fb5a3,#0f8f7e);display:flex;flex-direction:column}
.wh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.flag{font-size:40px}
.wh h2{margin:0;font-size:24px}
.wh p{margin:2px 0 0;opacity:.92}
.wbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wbtns button{background:#fff;color:var(--tx);border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;font-size:26px;box-shadow:0 4px 0 #0002}
.wbtns b{font-size:16px}
.wbtns small{font-size:13px;color:var(--mu);font-family:'Tajawal'}
.btn{border-radius:16px;padding:12px 18px;font-weight:800;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 #0002;transition:transform .1s}
.btn:active{transform:translateY(2px)}
.btn.pri{background:var(--p);color:#fff}
.btn.soft{background:#fff;color:var(--p);border:2px solid var(--line)}
.btn.rec{background:var(--pk);color:#fff}
.btn.red{background:var(--r);color:#fff}
.btn.ok{background:var(--g);color:#fff}
.btn.ghost{background:#f1edff;color:var(--p);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.wide{background:#fff;color:#0f8f7e;width:100%;margin-top:auto;font-size:19px}
.pt{color:var(--p);margin:0 0 12px;font-size:26px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chip{background:#fff;border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.focus{background:#fff8e1;border-radius:14px;padding:8px 12px;font-weight:700;color:#8a5a00;margin:10px 0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#fff;padding:6px;border-radius:18px;margin-bottom:14px}
.tab{border-radius:14px;padding:10px 4px;font-weight:700;font-size:14px;line-height:1.2}
.tab.on{background:var(--p);color:#fff}
.list{display:grid;gap:10px}

.hint{color:var(--mu);font-size:14px;text-align:center}
.steps{display:flex;gap:10px;margin:14px 0}
.stp{flex:1;background:#fff;border-radius:16px;padding:10px;text-align:center;font-weight:800;border:3px dashed var(--line)}

.stp small{font-family:'Tajawal';color:var(--mu)}
.recbox{background:#fff;border-radius:22px;padding:18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 6px 20px #5b4bdb14;margin-top:12px}
.recbox.locked{background:#f1edff;color:var(--mu);font-weight:700}

.pulse{font-size:40px;animation:pulse 1s infinite}

.res{text-align:center;font-size:22px;font-weight:800;margin:12px 0}

.wc{background:#fff;border:3px solid var(--line);border-radius:18px;padding:18px 6px;font-size:22px;font-weight:700;box-shadow:0 4px 0 var(--line);position:relative}
.wc.done{border-color:var(--g);background:#e8fbf7;box-shadow:0 4px 0 #bdeee6}

.ar-t{font-family:'Noto Naskh Arabic','Tajawal',serif}

.mbg{position:fixed;inset:0;background:#2a225099;z-index:50;display:grid;place-items:center;padding:16px}
.mcard{background:#fff;border-radius:28px;padding:22px 18px;width:100%;max-width:420px;text-align:center;position:relative;animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.x{position:absolute;top:10px;inset-inline-end:12px;font-size:22px;color:var(--mu)}
.mcount{color:var(--mu);font-weight:700}
.bigword{font-size:60px;font-weight:800;margin:18px 0;padding:18px;border-radius:22px;background:#f6f4ff;border:4px solid var(--line);word-break:break-word}

.mrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wres{min-height:56px;margin:14px 0 6px;font-weight:700}
.good{color:var(--g);font-size:22px}

.ex{font-family:'Noto Naskh Arabic';font-size:26px;color:var(--g)}

.note{background:#fff8e1;border-radius:16px;padding:12px 14px;margin-bottom:14px;line-height:1.7}

function chunk(a, n){ const r = []; for(let i=0;i<a.length;i+=n) r.push(a.slice(i,i+n).map((x,j) => ({ x, i:i+j }))); return r; }
const enLevels = tab => chunk(EN[S.lvl][tab], PER[tab]);
const wKey = (w, tab) => "w:" + S.lvl + ":" + (tab || S.tab) + ":" + w;
function itemDone(tab, e){
  if(tab === "stories") return isDone("st:"+S.lvl+":"+e.i+":listen");
  if(tab === "comp") return e.x.q.every((q,qi) => isDone("cp:"+S.lvl+":"+e.i+":"+qi));
  return isDone(wKey(e.x, tab));
}
const levelDone = (tab, L) => enLevels(tab)[L].every(e => itemDone(tab, e));
const levelOpen = (tab, L) => L === 0 || levelDone(tab, L-1);
const arUnits = () => (AR[S.lvl] || AR.KG3).units;
const arWKey = (u, j) => "aw:"+u.id+":"+j;
const arUnitDone = u => u.words.every((w,j) => isDone(arWKey(u,j))) && isDone("as:"+u.id+":read");
const arOpen = i => i === 0 || arUnitDone(arUnits()[i-1]);
function doneLevels(){
  if(!S.user) return 0; let n = 0;
  ["stories","comp","sight","hfw"].forEach(t => enLevels(t).forEach((_,L) => { if(levelDone(t,L)) n++; }));
  arUnits().forEach(u => { if(arUnitDone(u)) n++; });

}

const HAS_TTS = "speechSynthesis" in window;
let voices = [];
function loadVoices(){ if(HAS_TTS) voices = speechSynthesis.getVoices(); }
if(HAS_TTS){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function enVoice(){
  const pref = ["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Karen","Google UK English Female","Daniel"];
  for(const p of pref){ const v = voices.find(v => v.name.includes(p)); if(v) return v; }
  return voices.find(v => /^en[-_]US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
}
function speak(text, o = {}){
  if(!HAS_TTS){ toast("الصوت غير مدعوم في هذا المتصفح"); o.onend && o.onend(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; const v = enVoice(); if(v) u.voice = v;
  u.rate = o.rate || 0.9; u.pitch = 1.05;
  u.onboundary = e => { if(o.onword && (e.name === "word" || !e.name)) o.onword(e.charIndex); };
  u.onend = () => o.onend && o.onend();
  u.onerror = () => o.onend && o.onend();
  window._utt = u; speechSynthesis.speak(u);
}

function hlSentence(cid, i){
  document.querySelectorAll("#"+cid+" .sent").forEach((e,j) => e.classList.toggle("cur", j === i));
  document.querySelectorAll("#"+cid+" .w.hl").forEach(e => e.classList.remove("hl"));
  const e = document.getElementById(cid+"-s"+i); if(e) e.scrollIntoView({ block:"nearest", behavior:"smooth" });
}
function hlWord(cid, i, ci){
  let best = null;
  document.querySelectorAll("#"+cid+' .w[data-s="'+i+'"]').forEach(w => { if(+w.dataset.c <= ci) best = w; });
  document.querySelectorAll("#"+cid+" .w.hl").forEach(e => e.classList.remove("hl"));
  if(best) best.classList.add("hl");
}
function toggleRead(sents, cid, onDone){
  if(play.on){ stopPlay(); return; }
  if(!HAS_TTS){ toast("الصوت غير مدعوم في هذا المتصفح"); return; }
  speechSynthesis.cancel();
  play.on = true; const tk = ++play.token; setPlayBtn();
  const step = i => {
    if(tk !== play.token) return;
    if(i >= sents.length){ play.on = false; clearHL(); setPlayBtn(); onDone && onDone(); return; }
    hlSentence(cid, i);
    speak(sents[i], { rate:S.rate, onword: ci => hlWord(cid, i, ci), onend: () => { if(tk === play.token) setTimeout(() => step(i+1), 250); } });
  };
  step(0);
}
function renderSentences(arr, cid){
  return arr.map((s,i) => {
    let h = "", m; const re = /\S+/g;
    while((m = re.exec(s))) h += '<span class="w" data-s="'+i+'" data-c="'+m.index+'" onclick="sayWord(this)">'+esc(m[0])+'</span> ';
    return '<span class="sent" id="'+cid+'-s'+i+'">'+h+'</span>';
  }).join(" ");
}
function sayWord(el){
  if(play.on) return;
  const w = el.textContent.replace(/[^A-Za-z'\-]/g, ""); if(!w) return;
  el.classList.add("hl"); speak(w, { rate:0.75, onend: () => el.classList.remove("hl") });
}

function toggleRate(){ S.rate = S.rate < 0.8 ? 0.9 : 0.7; const b = $("#ratebtn"); if(b) b.innerHTML = rateLbl(); }

let rec = { mr:null, chunks:[], url:null, stream:null, timer:null, sec:0 };
const fmt = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
async function startRec(){
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast("التسجيل غير مدعوم في هذا المتصفح"); return; }
  stopPlay();
  try{ rec.stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch(e){ toast("🎤 لازم تسمح باستخدام المايك"); return; }
  rec.chunks = [];
  rec.mr = new MediaRecorder(rec.stream);
  rec.mr.ondataavailable = e => { if(e.data && e.data.size) rec.chunks.push(e.data); };
  rec.mr.onstop = () => {
    const blob = new Blob(rec.chunks, { type: rec.mr.mimeType || "audio/webm" });
    if(rec.url) URL.revokeObjectURL(rec.url);
    rec.url = URL.createObjectURL(blob);
    rec.stream && rec.stream.getTracks().forEach(t => t.stop());
    rec.mr = null;
    if(rec.sec >= 3) award(S.recBase + ":rec", 10);
    renderRecBox();
  };
  rec.mr.start(); rec.sec = 0;
  clearInterval(rec.timer);
  rec.timer = setInterval(() => { rec.sec++; const t = $("#rectime"); if(t) t.textContent = fmt(rec.sec); if(rec.sec >= 180) stopRec(); }, 1000);
  renderRecBox();
}
function stopRec(){ clearInterval(rec.timer); if(rec.mr && rec.mr.state === "recording") rec.mr.stop(); }
function renderRecBox(){
  const b = $("#recbox"); if(!b) return;
  const ar = S.view === "arstory";
  const locked = !ar && !(S.listened || isDone(S.recBase + ":listen"));
  const did = isDone(S.recBase + ":rec");
  if(locked){
    b.className = "recbox locked";
    b.innerHTML = '<div style="font-size:34px">🔒</div><div class="en" dir="ltr">Listen to the story first</div><div>اسمع القصة أولاً، بعدها تقدر تسجّل قراءتك</div>';
  } else if(rec.mr && rec.mr.state === "recording"){
    b.className = "recbox on";
    b.innerHTML = '<div class="pulse">🔴</div><b id="rectime">'+fmt(rec.sec)+'</b><div>'+(ar?"اقرأ القصة بصوت واضح":"Read the story aloud · اقرأ بصوت واضح")+'</div><button class="btn red" onclick="stopRec()">⏹ '+(ar?"إيقاف":"Stop · إيقاف")+'</button>';
  } else if(rec.url){
    b.className = "recbox";
    b.innerHTML = '<div>🎧 '+(ar?"اسمع تسجيلك":"Listen to yourself · اسمع تسجيلك")+'</div><audio controls src="'+rec.url+'"></audio><button class="btn soft" onclick="startRec()">🔁 '+(ar?"سجّل مرة ثانية":"Record again · سجّل مرة ثانية")+'</button>';
  } else {
    b.className = "recbox";
    b.innerHTML = '<button class="btn rec" onclick="startRec()">🎙️ '+(ar?"سجّل قراءتك":"Record · سجّل قراءتك")+'</button><div class="mu">'+(did?"✅ سجّلت هذه القصة من قبل":"+10 ⭐")+'</div>';
  }
}

/* =========================================================
   🗣️ التحقق من قراءة الكلمات (التعرف على الصوت)
   ========================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const HOMO = { to:["two","too","2"], two:["to","too","2"], too:["to","two"], for:["four","4"], four:["for","4"], one:["won","1"],
  eight:["ate","8"], i:["eye","aye","hi"], see:["sea","c"], be:["bee","b"], by:["buy","bye"], buy:["by","bye"], right:["write","rite"],
  write:["right","rite"], there:["their","they're"], their:["there","they're"], know:["no"], no:["know"], new:["knew"], knew:["new"],
  here:["hear"], hear:["here"], a:["uh","ah","eh","hey","8"], our:["hour","are"], are:["our","r"], you:["u"], your:["you're"],
  which:["witch"], some:["sum"], red:["read"], read:["red","reed"], first:["1st"], its:["it's"], dad:["that","dead"], am:["m","em"], an:["and","in"],
  in:["inn","and"], up:["op"], at:["that"], hop:["hope","hap"], sit:["set"], yes:["yeah"], whether:["weather"], piece:["peace"],
  told:["toll"], close:["clothes"], ever:["every"], sound:["sounds"], friends:["friend"], me:["mi"], he:["hee"], seven:["7"],
  sun:["son"], made:["maid"], ate:["eight"], fact:["facts"], main:["maine","mane"], eyes:["is","ice"], face:["faith"], wait:["weight"],
  road:["rode","rowed"], ride:["right"], line:["lion"], sure:["shore"], course:["coarse"], ought:["aught"], theme:["seem"] };
const norm = s => s.toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
let srObj = null;
function curWords(){ return (enLevels(S.tab)[S.wl] || []).map(e => e.x); }
function readWord(){
  const w = curWords()[S.wi];
  if(!SR){ selfCheck(); return; }
  stopSR(); stopPlay();
  const r = new SR(); srObj = r;
  r.lang = "en-US"; r.interimResults = false; r.maxAlternatives = 5;
  let got = false, denied = false;
  const b = $("#micbtn"); if(b){ b.classList.add("listening"); b.textContent = "👂 Listening..."; }
  $("#wres").innerHTML = '<span class="mu">Say the word now · اقرأ الكلمة الآن</span>';
  r.onresult = e => { got = true; const alts = []; const res = e.results[0]; for(let j=0;j<res.length;j++) alts.push(res[j].transcript); judge(w, alts); };
  r.onerror = e => { if(e.error === "not-allowed" || e.error === "service-not-allowed"){ denied = true; $("#wres").innerHTML = "🎤 اسمح باستخدام المايك من إعدادات المتصفح"; } };
  r.onend = () => {
    srObj = null;
    const b = $("#micbtn"); if(b){ b.classList.remove("listening"); b.textContent = "🎤 Read it · اقرأ"; }
    if(!got && !denied){ const wr = $("#wres"); if(wr) wr.innerHTML = '<span class="bad">🤔 I didn\'t hear you. Try again!</span><br><small class="mu">ما سمعتك، حاول مرة ثانية</small>'; }
  };
  try{ r.start(); }catch(e){ selfCheck(); }
}
function stopSR(){ if(srObj){ try{ srObj.abort(); }catch(e){} srObj = null; } }
function judge(w, alts){
  const t = norm(w), opts = [t].concat(HOMO[t] || []);
  const ok = alts.some(a => { const n = norm(a), toks = n.split(" "); return n === t || opts.some(o => toks.includes(o)); });
  const wr = $("#wres");
  if(ok) wordSuccess();
  else {
    S.tries++;
    wr.innerHTML = '<span class="bad">💪 Try again! · حاول مرة ثانية</span><br><small class="mu">I heard: "'+esc(alts[0]||"")+'"</small>' +
      (S.tries >= 3 ? '<br><button class="btn ghost sm" style="margin-top:8px" onclick="wordSuccess()">✓ قرأتها أمام المعلمة</button>' : "");
  }
}
function selfCheck(){
  $("#wres").innerHTML = '<div class="mu">اقرأ الكلمة بصوت عالٍ 🗣️ ثم اضغط</div><button class="btn ok sm" style="margin-top:8px" onclick="wordSuccess()">✓ I read it · قرأتها</button>';
}
function wordSuccess(){
  const w = curWords()[S.wi];
  const g = award(wKey(w), 2);
  $("#wres").innerHTML = '<span class="good">✅ Excellent! '+(g?"+2 ⭐":"")+'</span>';
  const big = $(".bigword"); if(big) big.classList.add("done");
  render();
  const wi = S.wi;
  if(S.wi < curWords().length - 1) setTimeout(() => { if(S.modal === "en" && S.wi === wi) stepWord(1); }, 1400);
}

  S.wi = Math.max(0, Math.min(n-1, S.wi + d)); S.tries = 0; stopSR(); showModal();

function showModal(){

    h = '<div class="mcard en" dir="ltr"><button class="x" onclick="closeModal()">✕</button>' +

      '<div class="mnav"><button class="btn ghost" onclick="stepWord(-1)">⟵ Back</button><button class="btn ghost" onclick="stepWord(1)">Next ⟶</button></div></div>';
  } else {

      '<div class="wres"><button class="btn ok" onclick="arWordOk()">'+(d?"✅ قرأتها":"✓ قرأتها (+1 ⭐)")+'</button></div>' +
      '<div class="mnav"><button class="btn ghost" onclick="stepWord(-1)">→ السابقة</button><button class="btn ghost" onclick="stepWord(1)">التالية ←</button></div></div>';
  }
  $("#modal").innerHTML = '<div class="mbg" onclick="if(event.target===this)closeModal()">'+h+'</div>';

function pinKey(k){

  render();
  if(S.pin.length === 4) setTimeout(checkPin, 150);
}

}

  const body = levels.map((lv, Li) => {

          return '<button class="item" onclick="go(\'comp\',{item:'+e.i+',ans:{},checked:false})">'+scene(scOf(c), lvlIdx(S.lvl)+3+e.i, true)+'<div><b>'+esc(c.t)+'</b><small>'+c.q.length+' questions · Read & Answer</small></div><span class="st">'+m+'/'+c.q.length+'</span></button>'; }).join("");
      } else {
        inner = '<div class="wgrid">'+lv.map((e,j) => '<button class="wc '+(isDone(wKey(e.x))?"done":"")+'" onclick="openWord('+Li+','+j+')">'+esc(e.x)+'</button>').join("")+'</div>';
      }
    }
    return '<section class="lvbox">'+lvHead(Li, open, done, n, lv.length)+(open ? '<div class="list">'+inner+'</div>' : '')+'</section>';
  }).join("");
  return back("go('home')") + '<div dir="ltr" class="en"><h1 class="pt">🇬🇧 English World · '+GR[S.lvl].en+'</h1>' +
    '<p class="focus">🔤 Phonics focus: '+esc(L.focus)+'</p>' +
    '<div class="tabs">'+tabs.map(t => '<button class="tab '+(S.tab===t[0]?"on":"")+'" onclick="go(\'en\',{tab:\''+t[0]+'\'})"><span class="ti">'+t[1]+'</span>'+t[2]+'</button>').join("")+'</div>' +
    (S.tab === "sight" || S.tab === "hfw" ? '<p class="mu">Tap a word to practice · اضغط على الكلمة للتدريب</p>' : '') +
    body + '</div>';
}

function vStory(){
  const L = EN[S.lvl], st = L.stories[S.item], k = "st:"+S.lvl+":"+S.item;
  S.recBase = k;
  const lis = S.listened || isDone(k+":listen");
  const lv = Math.floor(S.item / PER.stories) + 1;
  return back("go('en',{tab:'stories'})") + '<div dir="ltr" class="en"><h1 class="stt">📚 '+esc(st.t)+'</h1><p class="focus">🔤 Level '+lv+' · '+esc(L.focus)+'</p>' +
    scene(scOf(st), lvlIdx(S.lvl)*2+S.item) + '<div class="steps"><div class="stp '+(lis?"ok":"")+'">1️⃣ Listen<br><small>اسمع</small></div><div class="stp '+(isDone(k+":rec")?"ok":"")+'">2️⃣ Record<br><small>سجّل</small></div></div>' +
    '<div class="ctrl"><button id="playbtn" class="btn pri" onclick="playStory()">▶ Listen · استمع</button><button id="ratebtn" class="btn soft" onclick="toggleRate()">'+rateLbl()+'</button></div>' +
    '<div class="reader" id="rd">'+renderSentences(st.text,"rd")+'</div>' +
    '<p class="hint">💡 Tap any word to hear it · اضغط على أي كلمة لتسمعها</p>' +
    '<div id="recbox"></div></div>';
}
function playStory(){
  const k = "st:"+S.lvl+":"+S.item;
  toggleRead(EN[S.lvl].stories[S.item].text, "rd", () => { S.listened = true; award(k+":listen", 5); if(!(rec.mr && rec.mr.state === "recording")) render(); });
}

function vComp(){
  const c = EN[S.lvl].comp[S.item];
  return back("go('en',{tab:'comp'})") + '<div dir="ltr" class="en"><h1 class="stt">📝 '+esc(c.t)+'</h1>' +
    scene(scOf(c), lvlIdx(S.lvl)+3+S.item) + '<div class="ctrl"><button id="playbtn" class="btn pri" onclick="playComp()">▶ Listen · استمع</button><button id="ratebtn" class="btn soft" onclick="toggleRate()">'+rateLbl()+'</button></div>' +
    '<div class="reader sm" id="rd">'+renderSentences(splitS(c.text),"rd")+'</div>' +
    '<h2 class="qh">❓ Questions · الأسئلة</h2><div id="qs">'+qsHtml()+'</div></div>';
}
function playComp(){
  const c = EN[S.lvl].comp[S.item];
  toggleRead(splitS(c.text), "rd", () => award("cp:"+S.lvl+":"+S.item+":listen", 3));
}
function qsHtml(){
  const c = EN[S.lvl].comp[S.item];
  let right = 0;
  const qs = c.q.map((q,qi) => {
    if(S.checked && S.ans[qi] === q.a) right++;
    return '<div class="q"><p>'+(qi+1)+'. '+esc(q.q)+'</p><div class="opts">'+q.o.map((o,oi) => {
      let cls = S.ans[qi] === oi ? "sel" : "";
      if(S.checked && S.ans[qi] === oi) cls = oi === q.a ? "ok" : "bad";
      return '<button class="opt '+cls+'" onclick="pick('+qi+','+oi+')">'+esc(o)+'</button>';
    }).join("")+'</div></div>';
  }).join("");
  const all = c.q.every((q,qi) => isDone("cp:"+S.lvl+":"+S.item+":"+qi));
  const res = S.checked ? '<div class="res">'+(right === c.q.length ? "🎉 Amazing! " : "💪 ")+right+' / '+c.q.length+
    (right < c.q.length ? '<br><small class="mu">صحّح الإجابات الغلط عشان يخلص المستوى</small>' : '')+'</div>' : (all ? '<div class="res">✅ Done · تم</div>' : "");
  return qs + res + '<div class="center" style="margin-top:8px"><button class="btn pri" onclick="checkComp()">✓ Check · تحقق</button></div>';
}
function pick(qi, oi){ S.ans[qi] = oi; S.checked = false; $("#qs").innerHTML = qsHtml(); }
function checkComp(){
  const c = EN[S.lvl].comp[S.item];
  if(Object.keys(S.ans).length < c.q.length){ toast("جاوب على كل الأسئلة أولاً"); return; }
  S.checked = true;
  c.q.forEach((q,qi) => { if(S.ans[qi] === q.a) award("cp:"+S.lvl+":"+S.item+":"+qi, 5); });
  $("#qs").innerHTML = qsHtml();
}

/* ---------- العالم العربي (مستويات صف الطالب فقط) ---------- */
function vAr(){
  const A = AR[S.lvl], us = arUnits();
  return back("go('home')") + '<h1 class="pt" style="color:#0f8f7e">📗 العالم العربي · '+A.title+'</h1><p class="mu">اقرأ الكلمات ثم القصة — خلّص المستوى عشان يفتح لك اللي بعده 🔓</p><div class="list">' +
    us.map((s,i) => {
      const open = arOpen(i), done = arUnitDone(s);
      const n = s.words.filter((w,j) => isDone(arWKey(s,j))).length + (isDone("as:"+s.id+":read") ? 1 : 0), tot = s.words.length + 1;
      if(!open) return '<div class="stage lockd"><span class="snum big">🔒</span><div><b>المستوى '+(i+1)+': '+s.t+'</b><small>خلّص المستوى '+i+' أولاً</small></div></div>';
      return '<button class="stage" onclick="go(\'arstage\',{arStage:'+i+'})"><span class="snum big">'+(done?"🏅":s.ic)+'</span><div><b>المستوى '+(i+1)+': '+s.t+'</b><small>'+s.note+' · '+n+'/'+tot+'</small><div class="mini"><i style="width:'+Math.round(n/tot*100)+'%"></i></div></div><span class="ex">'+s.words[0]+'</span></button>';
    }).join("") + '</div>';
}
function vArStage(){
  const s = arUnits()[S.arStage];
  if(!arOpen(S.arStage)) return vAr();
  return back("go('ar')") + '<h1 class="pt" style="color:#0f8f7e">المستوى '+(S.arStage+1)+': '+s.t+'</h1>' +
    '<h2 class="sec">🔤 الكلمات <small class="mu">— اضغط على الكلمة واقرأها</small></h2>' +
    '<div class="wgrid ar">'+s.words.map((w,j) => '<button class="wc '+(isDone(arWKey(s,j))?"done":"")+'" onclick="openArWord('+j+')">'+w+'</button>').join("")+'</div>' +
    '<h2 class="sec">📖 القصة</h2><button class="stage" onclick="go(\'arstory\')">'+scene(scOf(s), S.arStage+1, true)+'<div><b class="ar-t">'+s.story.t+'</b><small>اقرأ القصة وسجّل صوتك</small></div>'+(isDone("as:"+s.id+":read")?"✅":"")+(isDone("as:"+s.id+":rec")?"🎙️":"")+'</button>';
}
function vArStory(){
  const s = arUnits()[S.arStage]; S.recBase = "as:"+s.id;
  const d = isDone("as:"+s.id+":read");
  return back("go('arstage')") + '<h1 class="pt ar-t" style="color:#0f8f7e">📖 '+s.story.t+'</h1>' +
    scene(scOf(s), S.arStage+1) + '<div class="arread">'+s.story.text.map(l => '<p>'+l+'</p>').join("")+'</div>' +
    '<div class="center" style="margin-top:14px"><button class="btn ok" onclick="arRead()">'+(d?"✅ قرأت القصة":"✓ قرأت القصة (+5 ⭐)")+'</button></div>' +
    '<div id="recbox"></div>';
}
function arRead(){ const s = arUnits()[S.arStage]; if(award("as:"+s.id+":read", 5) && !(rec.mr && rec.mr.state === "recording")) render(); }

/* ---------- لوحة المعلمة ---------- */
function adminLogin(){
  const p = prompt("الرقم السري للمعلمة"); if(p === null) return;
  if(p === SETTINGS.adminPin){ S.admin = true; go("admin"); } else toast("الرقم غير صحيح");
}
function vAdmin(){
  if(!S.admin) return vLogin();
  return back("S.admin=false;go('login',{grade:null,sec:null,stu:null})") + '<h1 class="pt">👩‍🏫 لوحة المعلمة</h1>' +
    '<div class="note">🔑 الرقم السري لكل الطلاب: <b dir="ltr">'+esc(SETTINGS.studentPin)+'</b> (تقدري تغيّريه من SETTINGS في أول الملف).<br>📌 النقاط والتسجيلات محفوظة على جهاز الطالب فقط.<br>📚 لإضافة قصص أو كلمات: أضيفيها في آخر قائمة الصف في EN أو AR، والمستويات تتقسم لوحدها.</div>' +
    '<table><tr><th>الصف</th><th>القسم</th><th>الاسم</th><th>Name</th><th>نقاط هذا الجهاز</th></tr>' +
    STUDENTS.map(s => '<tr><td>'+GR[s.grade].ar+'</td><td>'+(SECS[s.sec] ? SECS[s.sec].ar : "-")+'</td><td>'+esc(s.name)+'</td><td dir="ltr" class="en">'+esc(s.en||"")+'</td><td>⭐ '+load(s.id).points+'</td></tr>').join("") +
    '</table><button class="btn pri" onclick="window.print()">🖨️ طباعة القائمة</button>';
}

/* ---------- البداية ---------- */
buildBg();
$("#foot").innerHTML = logo("lg-foot")+'<b>'+esc(SETTINGS.school)+'</b> · '+esc(SETTINGS.branch)+'<br><small dir="ltr">'+esc(SETTINGS.schoolEn)+' · © '+new Date().getFullYear()+'</small>';
try{ localStorage.removeItem("rh_last"); }catch(e){}
render();
</script>
</body>
